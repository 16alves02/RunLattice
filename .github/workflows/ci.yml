name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-tests
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runlattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runlattice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
      - name: Run API and worker integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: integration-only-secret-that-is-long-enough
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
