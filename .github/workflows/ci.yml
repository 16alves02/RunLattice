name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "release/**", "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit dependencies (no high or critical advisories)
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-tests
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runlattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runlattice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
      - name: Prepare Supabase API roles for PostgreSQL integration tests
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $block$;
          SQL
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Verify TwoFactor row-level security
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE
            rls_enabled boolean;
            policy_count integer;
          BEGIN
            SELECT relrowsecurity INTO rls_enabled
            FROM pg_class
            WHERE oid = 'public."TwoFactor"'::regclass;

            IF rls_enabled IS DISTINCT FROM true THEN
              RAISE EXCEPTION 'TwoFactor RLS is not enabled';
            END IF;

            SELECT count(*) INTO policy_count
            FROM pg_policies
            WHERE schemaname = 'public'
              AND tablename = 'TwoFactor'
              AND policyname IN ('deny_all_api_roles_anon', 'deny_all_api_roles_authenticated');

            IF policy_count <> 2 THEN
              RAISE EXCEPTION 'Expected two deny-all API policies, found %', policy_count;
            END IF;

            IF EXISTS (
              SELECT 1
              FROM information_schema.role_table_grants
              WHERE table_schema = 'public'
                AND table_name = 'TwoFactor'
                AND grantee IN ('anon', 'authenticated')
            ) THEN
              RAISE EXCEPTION 'Supabase API roles still have TwoFactor table grants';
            END IF;
          END
          $block$;
          SQL
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice
      - name: Run API and worker integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/runlattice?schema=public
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: integration-only-secret-that-is-long-enough
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
