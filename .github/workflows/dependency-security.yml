name: Dependency security

on:
  push:
    branches: ["feature/webhooks-scheduling-integration-tests"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-safe-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependency graph
        run: npm install --no-audit --no-fund
      - name: Apply non-breaking security fixes only
        run: npm audit fix --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Enforce no high or critical advisories
        run: npm audit --audit-level=high
      - name: Commit safe dependency and lockfile updates
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "security: apply compatible dependency fixes and lock versions"
            git push
          else
            echo "No dependency changes required."
          fi
